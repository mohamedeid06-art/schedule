<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUFE · Mechanical Engineering — Batch 30</title>

<!-- PWA Manifest & Icons -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0d141d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ME-1 Schedule">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  /* Minimal Matte Slate & Ocean/Ice Palette */
  --bg: #0d141d;
  --surface: #141f2d;
  --surface-alt: #1b293b;
  --surface-glass: rgba(20, 31, 45, 0.75);
  --border: #23344a;
  --border-dark: #304764;
  --border-glow: rgba(43, 164, 204, 0.35);
  --text-main: #edf5f9;
  --text-muted: #859bb3;
  --text-subtle: #576f87;
  
  --accent: #2ba4cc;
  --accent-light: #6ec4e0;
  --accent-glow: rgba(43, 164, 204, 0.2);
  --bone: #eae3d5;
  --bone-glow: rgba(234, 227, 213, 0.15);

  --quiz-color: #f97316;
  --quiz-glow: rgba(249, 115, 22, 0.25);

  --c-gen: #38bdf8;
  --c-mth: #2ba4cc;
  --c-emc: #6366f1;
  --c-mdp1: #14b8a6;
  --c-mdp2: #0284c7;
  --c-epe: #f43f5e;
}

[data-theme="light"] {
  --bg: #eef5f8;
  --surface: #ffffff;
  --surface-alt: #deebf2;
  --surface-glass: rgba(255, 255, 255, 0.85);
  --border: #c2d7e3;
  --border-dark: #a5c3d3;
  --border-glow: rgba(25, 122, 156, 0.3);
  --text-main: #0c1926;
  --text-muted: #506a7e;
  --text-subtle: #7997ab;
  --accent: #197a9c;
  --accent-light: #2ba4cc;
  --accent-glow: rgba(25, 122, 156, 0.14);
  --bone: #23344a;
  --bone-glow: rgba(35, 52, 74, 0.1);
  --quiz-color: #ea580c;
  --quiz-glow: rgba(234, 88, 12, 0.15);
}

*{box-sizing:border-box;margin:0;padding:0;}

body {
  background-color: var(--bg);
  color: var(--text-main);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  padding: 16px 12px 105px;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.25s ease, color 0.25s ease;
}

.container {
  max-width: 480px;
  margin: 0 auto;
  transition: max-width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

.container.pc-mode {
  max-width: 1240px;
}

/* Masthead */
.masthead {
  border-bottom: 1px solid var(--border);
  padding-bottom: 14px;
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 12px;
}
.uni-title {
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent-light);
}
.faculty-title {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-top: 2px;
}
.dept-title {
  font-size: 23px;
  font-weight: 800;
  color: var(--text-main);
  letter-spacing: -0.03em;
  margin-top: 3px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.batch-tag {
  font-size: 10px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 6px;
  background: var(--bone-glow);
  color: var(--bone);
  border: 1px solid var(--border-dark);
  letter-spacing: 0.05em;
}
.container.pc-mode .dept-title {
  font-size: 28px;
}

.date-academic-strip {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 5px;
  font-size: 12px;
  color: var(--text-muted);
}
.academic-week-badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 7px;
  border-radius: 9999px;
  background: var(--accent-glow);
  color: var(--accent-light);
  border: 1px solid var(--accent);
}

/* Actions Bar */
.top-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}
.action-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-muted);
  height: 36px;
  padding: 0 10px;
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
}
.action-btn.icon-only {
  width: 36px;
  padding: 0;
  justify-content: center;
}
.action-btn:hover {
  color: var(--text-main);
  border-color: var(--accent);
  transform: translateY(-1px);
}
.action-btn.active-mode {
  background: var(--surface-alt);
  color: var(--accent-light);
  border-color: var(--accent);
}
.action-btn.install-btn {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
  display: none;
}
.action-btn.install-btn:hover {
  opacity: 0.9;
}
.action-btn svg { width: 15px; height: 15px; fill: currentColor; }

/* Dynamic Island Capsule */
.live-status-capsule {
  background: var(--surface-glass);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border);
  border-radius: 30px;
  padding: 8px 16px;
  margin: 0 auto 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 12px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.06);
  max-width: 100%;
}
.live-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.live-indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.25);
  animation: live-pulse 2s infinite;
  flex-shrink: 0;
}
.live-indicator.idle {
  background: #576f87;
  box-shadow: none;
  animation: none;
}
@keyframes live-pulse {
  0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
  70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
  100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
}
.live-text {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.live-text strong { color: var(--text-main); }
.live-time-now {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent-light);
  flex-shrink: 0;
}

/* Up Next Hero Card */
.hero-card {
  background: linear-gradient(135deg, rgba(43, 164, 204, 0.12) 0%, rgba(20, 31, 45, 0.85) 100%);
  border: 1px solid var(--border-glow);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 16px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08);
  position: relative;
  overflow: hidden;
}
.hero-card::after {
  content: '';
  position: absolute;
  top: -40px;
  right: -40px;
  width: 100px;
  height: 100px;
  background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
  pointer-events: none;
}
.hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}
.hero-pill {
  font-size: 9px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  background: var(--accent-glow);
  color: var(--accent-light);
  border: 1px solid var(--accent);
  padding: 2px 7px;
  border-radius: 6px;
}
.hero-timer {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
}
.hero-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--text-main);
  line-height: 1.3;
}
.hero-meta {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 10px;
  font-size: 12px;
  color: var(--text-muted);
}
.hero-room-badge {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 3px 8px;
  border-radius: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent-light);
  cursor: pointer;
}

/* Control Bar */
.control-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}
.group-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  justify-content: space-between;
}
.control-label {
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.section-select {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-main);
  font-family: inherit;
  font-size: 12.5px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 9px;
  outline: none;
  cursor: pointer;
  border-left: 3.5px solid var(--accent);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
}

/* Segmented Date Strip */
.days-bar {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  padding: 4px;
  border-radius: 12px;
  margin-bottom: 16px;
}
.day-btn {
  border: none;
  background: transparent;
  padding: 7px 2px;
  border-radius: 9px;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.day-btn .day-name {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-muted);
}
.day-btn .day-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 800;
  color: var(--text-main);
}
.day-btn .today-tag {
  font-size: 8px;
  font-weight: 800;
  color: var(--accent-light);
}
.day-btn.has-quiz {
  border: 1px solid var(--quiz-color);
  background: var(--quiz-glow);
}
.day-btn.has-quiz .quiz-badge-dot {
  font-size: 8px;
  font-weight: 800;
  color: var(--quiz-color);
}
.day-btn.active {
  background: var(--surface);
  box-shadow: 0 3px 8px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
}
.day-btn.active .day-name {
  color: var(--accent-light);
}
.day-btn.active .day-num {
  color: var(--accent-light);
}

/* Alert Banner */
.day-assessment-banner {
  background: var(--quiz-glow);
  border: 1px solid var(--quiz-color);
  border-radius: 10px;
  padding: 10px 14px;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 12px;
  color: var(--text-main);
  box-shadow: 0 4px 12px rgba(249, 115, 22, 0.15);
}
.day-assessment-banner strong {
  color: var(--quiz-color);
}
.details-btn {
  background: var(--quiz-color);
  color: #fff;
  border: none;
  padding: 5px 12px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
  transition: opacity 0.15s ease;
}
.details-btn:hover {
  opacity: 0.9;
}

/* Staggered Cascade Entry Animation */
@keyframes cardCascade {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
.cascade-item {
  animation: cardCascade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
}

/* Dimming & Highlighting */
.grid-card.dimmed, .timeline-card.dimmed {
  opacity: 0.15 !important;
  filter: grayscale(80%);
}
.grid-card.highlighted, .timeline-card.highlighted {
  box-shadow: 0 0 0 2.5px var(--c), 0 6px 18px rgba(0,0,0,0.45) !important;
  transform: scale(1.02);
  z-index: 5;
}

/* Timeline Layout */
.timeline-wrap {
  display: flex;
  flex-direction: column;
  gap: 14px;
  touch-action: pan-y;
  position: relative;
}
.timeline-item {
  display: flex;
  gap: 12px;
  position: relative;
}
.time-col {
  width: 80px;
  flex-shrink: 0;
  text-align: right;
  padding-top: 2px;
}
.time-start {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-main);
}
.time-end {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: var(--text-muted);
  margin-top: 2px;
}
.time-dur {
  display: inline-block;
  font-size: 9px;
  font-weight: 600;
  background: var(--surface-alt);
  color: var(--text-muted);
  padding: 1px 5px;
  border-radius: 4px;
  margin-top: 4px;
}
.rail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.rail-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  border: 2.5px solid var(--c);
  background: var(--surface);
  z-index: 2;
  margin-top: 4px;
}
.rail-line {
  position: absolute;
  top: 16px;
  bottom: -20px;
  width: 2px;
  background: var(--border);
}
.timeline-item:last-child .rail-line { display: none; }

/* Current Time Indicator Line */
.current-time-line {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 4px 0;
  z-index: 10;
}
.time-line-tag {
  width: 80px;
  text-align: right;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 800;
  color: #ef4444;
}
.time-line-indicator {
  flex: 1;
  height: 2px;
  background: #ef4444;
  position: relative;
  border-radius: 2px;
}
.time-line-indicator::before {
  content: '';
  position: absolute;
  left: -4px;
  top: -3px;
  width: 8px;
  height: 8px;
  background: #ef4444;
  border-radius: 50%;
  box-shadow: 0 0 6px #ef4444;
}

/* Polished Card Layout */
.timeline-card {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 3px 8px rgba(0,0,0,0.18);
  border-radius: 12px;
  padding: 13px 15px;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}
.timeline-card:hover {
  transform: translateY(-1px);
}
.timeline-card.is-live {
  border-color: #10b981;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.1), 0 0 18px rgba(16, 185, 129, 0.25);
}
.timeline-card.has-task-border {
  border-color: var(--quiz-color);
}
.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 5px;
}
.card-code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 800;
  color: var(--c);
}
.badge {
  font-size: 9px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 5px;
}
.badge-type { background: var(--surface-alt); color: var(--text-muted); }
.badge-all { background: rgba(43, 164, 204, 0.18); color: var(--accent-light); }
.badge-live { background: rgba(16, 185, 129, 0.15); color: #10b981; }
.badge-task { background: var(--quiz-color); color: #ffffff; cursor: pointer; }

.card-title {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text-main);
  line-height: 1.35;
  margin-bottom: 10px;
}
.card-room-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  color: var(--accent-light);
  padding: 4px 8px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
}
.card-room-pill:hover {
  border-color: var(--accent);
  background: var(--surface);
  transform: translateY(-1px);
}

.break-item {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: -4px 0;
}
.break-spacer { width: 80px; flex-shrink: 0; }
.break-card {
  flex: 1;
  border: 1px dashed var(--border);
  background: var(--surface-alt);
  border-radius: 8px;
  padding: 6px 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--text-muted);
  font-weight: 500;
}

/* Full Week Grid Matrix */
.matrix-wrapper {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 14px rgba(0,0,0,0.2);
}
.matrix-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.matrix-grid {
  display: grid;
  grid-template-columns: 80px repeat(5, minmax(170px, 1fr));
  grid-template-rows: 38px repeat(8, minmax(72px, auto));
  min-width: 930px;
}
.matrix-head {
  background: var(--surface-alt);
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding: 8px 10px;
  font-size: 12px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.matrix-head.corner {
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
}
.matrix-head.is-today {
  background: var(--accent-glow);
  color: var(--accent-light);
}
.matrix-head.has-quiz-day {
  border-top: 3px solid var(--quiz-color);
}
.matrix-head .today-pill {
  font-size: 8px;
  font-weight: 800;
  padding: 1px 4px;
  border-radius: 3px;
  background: var(--accent);
  color: #fff;
}
.matrix-head .quiz-pill {
  font-size: 8px;
  font-weight: 800;
  padding: 1px 4px;
  border-radius: 3px;
  background: var(--quiz-color);
  color: #fff;
}
.matrix-time {
  background: var(--surface-alt);
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-muted);
}
.matrix-cell {
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding: 4px;
  display: flex;
  flex-direction: column;
}
.grid-card {
  height: 100%;
  border-radius: 7px;
  padding: 6px 8px;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3.5px solid var(--c);
  transition: all 0.15s ease;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
}
.grid-card.has-task {
  border-color: var(--quiz-color);
}
.grid-card .code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  font-weight: 700;
  color: var(--text-main);
}
.grid-card .type {
  font-size: 8.5px;
  font-weight: 700;
  padding: 1px 4px;
  border-radius: 3px;
  background: var(--surface-alt);
  color: var(--text-muted);
  text-transform: uppercase;
}
.grid-card .type.all {
  background: rgba(43, 164, 204, 0.18);
  color: var(--accent-light);
}
.grid-card .type.quiz-tag {
  background: var(--quiz-color);
  color: #fff;
  cursor: pointer;
}
.grid-card .title {
  font-size: 10.5px;
  color: var(--text-muted);
  margin-top: 2px;
  line-height: 1.25;
}
.grid-card .footer {
  margin-top: auto;
  padding-top: 4px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  color: var(--text-muted);
  border-top: 1px dashed var(--border);
}
.room-badge {
  background: var(--surface-alt);
  padding: 1px 5px;
  border-radius: 4px;
  color: var(--text-main);
  font-weight: 600;
  cursor: pointer;
}
.cell-empty {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--text-subtle);
}

/* Dedicated In-App Drive View */
.drive-view-container {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.drive-header-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
}
.drive-header-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 8px;
}
.drive-header-desc {
  font-size: 12px;
  color: var(--text-muted);
  line-height: 1.45;
}
.drive-main-link-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--accent-glow);
  border: 1px solid var(--accent);
  color: var(--accent-light);
  padding: 12px 14px;
  border-radius: 10px;
  font-size: 12.5px;
  font-weight: 700;
  text-decoration: none;
  transition: all 0.2s ease;
  box-shadow: 0 4px 12px rgba(43, 164, 204, 0.15);
}
.drive-main-link-btn:hover {
  background: rgba(43, 164, 204, 0.35);
  transform: translateY(-1px);
}
.course-accordion {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
}
.course-accordion.open {
  border-color: var(--accent);
  box-shadow: 0 4px 14px rgba(0,0,0,0.3);
}
.accordion-header {
  padding: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
}
.acc-left {
  display: flex;
  align-items: center;
  gap: 10px;
}
.acc-color-dot {
  width: 10px;
  height: 10px;
  border-radius: 3px;
}
.acc-code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--text-main);
}
.acc-name {
  font-size: 11.5px;
  color: var(--text-muted);
  display: block;
  margin-top: 1px;
}
.acc-arrow {
  font-size: 11px;
  color: var(--text-muted);
  transition: transform 0.2s ease;
}
.course-accordion.open .acc-arrow {
  transform: rotate(180deg);
}
.accordion-content {
  padding: 0 14px 14px;
  display: none;
  flex-direction: column;
  gap: 8px;
  border-top: 1px dashed var(--border);
  margin-top: 2px;
  padding-top: 12px;
}
.course-accordion.open .accordion-content {
  display: flex;
}
.drive-sub-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  color: var(--text-main);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.15s ease;
}
.drive-sub-btn:hover {
  border-color: var(--accent);
  color: var(--accent-light);
  background: var(--surface);
  transform: translateY(-1px);
}

/* Floating Glass Bottom Nav */
.bottom-nav {
  position: fixed;
  bottom: 16px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 24px);
  max-width: 500px;
  background: rgba(20, 31, 45, 0.88);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-dark);
  border-radius: 24px;
  padding: 6px 8px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255,255,255,0.08);
  z-index: 900;
}
[data-theme="light"] .bottom-nav {
  background: rgba(255, 255, 255, 0.88);
  border-color: var(--border);
  box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
}
.nav-item {
  border: none;
  background: transparent;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 6px 10px;
  color: var(--text-muted);
  cursor: pointer;
  border-radius: 12px;
  transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  text-decoration: none;
}
.nav-item svg { width: 18px; height: 18px; fill: currentColor; }
.nav-item span { font-size: 10px; font-weight: 700; }
.nav-item.active {
  color: var(--accent-light);
  transform: translateY(-2px);
}
.nav-notif-dot {
  position: absolute;
  top: 6px;
  right: 10px;
  width: 7px;
  height: 7px;
  background: #ef4444;
  border-radius: 50%;
  display: none;
}
.nav-notif-dot.active {
  display: block;
  box-shadow: 0 0 6px #ef4444;
}
.nav-task-badge {
  position: absolute;
  top: 4px;
  right: 8px;
  background: var(--quiz-color);
  color: #fff;
  font-size: 8px;
  font-weight: 800;
  padding: 1px 4px;
  border-radius: 9999px;
  display: none;
}
.nav-task-badge.active {
  display: block;
}

/* Modals */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(13, 20, 29, 0.75);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal-card {
  background: var(--surface);
  border: 1px solid var(--border-dark);
  border-radius: 16px;
  width: 100%;
  max-width: 480px;
  max-height: 82vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 24px 40px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.06);
}
.modal-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title {
  font-size: 13.5px;
  font-weight: 800;
  color: var(--accent-light);
  display: flex;
  align-items: center;
  gap: 8px;
}
.modal-close {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 22px;
  padding: 2px 6px;
}
.modal-body {
  padding: 14px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.modal-item {
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.modal-item.assessment-card {
  border-left: 4px solid var(--quiz-color);
}
.modal-top-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-tag {
  font-size: 9.5px;
  font-weight: 800;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--accent-glow);
  color: var(--accent-light);
}
.modal-tag.quiz {
  background: var(--quiz-glow);
  color: var(--quiz-color);
}
.modal-date {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
}
.modal-item-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--text-main);
}
.modal-item-body {
  font-size: 11.5px;
  color: var(--text-muted);
  line-height: 1.45;
}
.modal-item-extra {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10.5px;
  color: var(--accent-light);
  margin-top: 4px;
}

/* Floating Glass Toast Notification */
.floating-toast {
  position: fixed;
  bottom: 84px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(20, 31, 45, 0.94);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--accent);
  color: var(--text-main);
  padding: 10px 18px;
  border-radius: 30px;
  font-size: 12px;
  font-weight: 600;
  box-shadow: 0 12px 28px rgba(0,0,0,0.45);
  z-index: 2000;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 90%;
}
.floating-toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
  pointer-events: auto;
}

/* Legend */
.legend {
  margin-top: 18px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 10px 14px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px 16px;
  align-items: center;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
}
.legend-hint { font-size: 11px; font-weight: 700; color: var(--accent-light); margin-right: 4px; }
.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 6px;
  border: 1px solid transparent;
  transition: all 0.15s ease;
  user-select: none;
}
.legend-item:hover {
  background: var(--surface-alt);
  color: var(--text-main);
}
.legend-item.active {
  background: var(--surface-alt);
  border-color: var(--accent);
  color: var(--accent-light);
  font-weight: 800;
}
.legend-dot { width: 8px; height: 8px; border-radius: 2px; }

/* Print Mode */
@media print {
  @page {
    size: A4 landscape !important;
    margin: 8mm !important;
  }

  html, body {
    background: #ffffff !important;
    color: #000000 !important;
    padding: 0 !important;
    margin: 0 !important;
    background-image: none !important;
    -webkit-print-color-adjust: exact !important;
    print-color-adjust: exact !important;
  }

  .top-actions, .control-bar, .days-bar, .bottom-nav, .modal-overlay, .floating-toast, .hero-card, .live-status-capsule, .legend-hint, #deviceModeBtn, #calendarBtn, #printBtn, #themeBtn, #pwaTopInstallBtn {
    display: none !important;
  }

  .container {
    max-width: 100% !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  .masthead {
    border-bottom: 2px solid #0f172a !important;
    padding-bottom: 8px !important;
    margin-bottom: 12px !important;
  }
  .dept-title { font-size: 19px !important; color: #0f172a !important; }
  .uni-title, .faculty-title, .date-academic-strip { color: #334155 !important; }

  body.print-day-mode .matrix-wrapper,
  body.print-day-mode .legend {
    display: none !important;
  }
  body.print-day-mode .timeline-wrap {
    display: flex !important;
    max-width: 100% !important;
    gap: 12px !important;
  }
  body.print-day-mode .timeline-item {
    gap: 14px !important;
    page-break-inside: avoid !important;
  }
  body.print-day-mode .timeline-card {
    border: 1px solid #cbd5e1 !important;
    box-shadow: none !important;
    background: #ffffff !important;
    border-left: 4px solid var(--c) !important;
  }

  body.print-week-mode .timeline-wrap {
    display: none !important;
  }
  body.print-week-mode .matrix-wrapper {
    display: block !important;
    box-shadow: none !important;
    border: 1.5px solid #0f172a !important;
    border-radius: 4px !important;
    overflow: visible !important;
    background: #ffffff !important;
    page-break-inside: avoid !important;
  }
  body.print-week-mode .matrix-scroll {
    overflow: visible !important;
  }
  body.print-week-mode .matrix-grid {
    min-width: 0 !important;
    width: 100% !important;
    grid-template-columns: 70px repeat(5, 1fr) !important;
    grid-template-rows: 32px repeat(8, minmax(56px, auto)) !important;
  }
  body.print-week-mode .matrix-head {
    background: #f1f5f9 !important;
    border-bottom: 1.5px solid #0f172a !important;
    border-right: 1px solid #cbd5e1 !important;
    color: #0f172a !important;
    font-size: 11px !important;
    font-weight: 800 !important;
    padding: 4px 6px !important;
  }
  body.print-week-mode .matrix-head.is-today {
    background: #f1f5f9 !important;
    color: #0f172a !important;
  }
  body.print-week-mode .matrix-head .today-pill,
  body.print-week-mode .matrix-head .quiz-pill { display: none !important; }
  body.print-week-mode .matrix-time {
    background: #f8fafc !important;
    border-bottom: 1px solid #cbd5e1 !important;
    border-right: 1.5px solid #0f172a !important;
    color: #334155 !important;
    font-size: 10px !important;
    padding: 2px !important;
  }
  body.print-week-mode .matrix-cell {
    border-bottom: 1px solid #cbd5e1 !important;
    border-right: 1px solid #cbd5e1 !important;
    padding: 3px !important;
  }
  body.print-week-mode .grid-card {
    box-shadow: none !important;
    border: 1px solid #94a3b8 !important;
    border-left: 3.5px solid var(--c) !important;
    border-radius: 4px !important;
    padding: 4px 6px !important;
    break-inside: avoid !important;
    background: #ffffff !important;
    opacity: 1 !important;
    filter: none !important;
  }
  body.print-week-mode .grid-card .code { font-size: 10px !important; color: #0f172a !important; }
  body.print-week-mode .grid-card .type { font-size: 8px !important; background: #f1f5f9 !important; color: #334155 !important; padding: 0 3px !important; }
  body.print-week-mode .grid-card .title { font-size: 9px !important; color: #334155 !important; margin-top: 1px !important; line-height: 1.2 !important; }
  body.print-week-mode .grid-card .footer { font-size: 8.5px !important; padding-top: 2px !important; border-top: 1px dashed #cbd5e1 !important; color: #475569 !important; }
  body.print-week-mode .grid-card .room-badge { background: #f1f5f9 !important; border: 1px solid #cbd5e1 !important; padding: 0 4px !important; font-size: 8px !important; color: #0f172a !important; }
  body.print-week-mode .legend {
    margin-top: 10px !important;
    padding: 6px 10px !important;
    border: 1px solid #cbd5e1 !important;
    gap: 6px 14px !important;
    page-break-inside: avoid !important;
  }
  body.print-week-mode .legend-item { font-size: 9px !important; color: #334155 !important; }
}
</style>
</head>
<body>

<div class="container" id="mainContainer">

  <!-- Header -->
  <header class="masthead">
    <div>
      <div class="uni-title">Cairo University · Faculty of Engineering</div>
      <div class="faculty-title">Department of Mechanical Engineering</div>
      <h1 class="dept-title">
        Schedule
        <span class="batch-tag">BATCH 30</span>
      </h1>
      
      <div class="date-academic-strip">
        <span id="fullDateDisplay">Today's Date</span>
        <span>•</span>
        <span class="academic-week-badge" id="academicWeekBadge">Academic Week</span>
      </div>
    </div>

    <!-- Actions Bar -->
    <div class="top-actions">
      <button class="action-btn install-btn" id="pwaTopInstallBtn" title="Install Application">
        <span>📲 Install</span>
      </button>

      <button class="action-btn" id="deviceModeBtn" title="Switch layout width (Mobile / PC)">
        <span id="deviceModeIcon">💻</span>
        <span id="deviceModeText">PC View</span>
      </button>

      <button class="action-btn icon-only" id="calendarBtn" title="Download .ics Calendar">
        <svg viewBox="0 0 24 24"><path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5v-5z"/></svg>
      </button>
      
      <button class="action-btn icon-only" id="printBtn" title="Print Schedule">
        <svg viewBox="0 0 24 24"><path d="M19 8H5c-1.66 0-3 1.34-3 3v6h4v4h12v-4h4v-6c0-1.66-1.34-3-3-3zm-3 11H8v-5h8v5zm3-7c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm-1-9H6v4h12V3z"/></svg>
      </button>
      
      <button class="action-btn icon-only" id="themeBtn" title="Theme Mode">
        <svg id="themeIcon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
      </button>
    </div>
  </header>

  <!-- Dynamic Island Capsule -->
  <div class="live-status-capsule" id="liveStatusBox">
    <div class="live-left">
      <span class="live-indicator" id="liveDot"></span>
      <span class="live-text" id="liveText">Checking schedule status...</span>
    </div>
    <span class="live-time-now" id="liveClock"></span>
  </div>

  <!-- Control Bar -->
  <div class="control-bar" id="scheduleControlBar">
    <div class="group-controls">
      <span class="control-label">Section:</span>
      <select class="section-select" id="sectionSelect">
        <option value="ME1-01">Section 01</option>
        <option value="ME1-02">Section 02</option>
        <option value="ME1-03">Section 03</option>
        <option value="ME1-04">Section 04</option>
      </select>
    </div>
  </div>

  <!-- Day Selector -->
  <div class="days-bar" id="daysBar"></div>

  <!-- View Slot -->
  <main id="viewContainer"></main>

  <!-- Legend -->
  <div class="legend" id="legend"></div>

</div>

<!-- Floating Glass Bottom Nav -->
<nav class="bottom-nav">
  <button class="nav-item" id="navDayBtn" onclick="setView('day')">
    <svg viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
    <span>Daily</span>
  </button>

  <button class="nav-item active" id="navWeekBtn" onclick="setView('week')">
    <svg viewBox="0 0 24 24"><path d="M4 4h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 10h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4zM4 16h4v4H4zm6 0h4v4h-4zm6 0h4v4h-4z"/></svg>
    <span>Full Week</span>
  </button>

  <button class="nav-item" id="navDriveBtn" onclick="setView('drive')">
    <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
    <span>Drive</span>
  </button>

  <button class="nav-item" id="navTaskBtn" onclick="openAssessmentModal()">
    <span class="nav-task-badge" id="navTaskBadge">0</span>
    <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm2 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/></svg>
    <span>Tasks</span>
  </button>

  <button class="nav-item" id="navNotifBtn" onclick="openNotifModal()">
    <span class="nav-notif-dot" id="navNotifDot"></span>
    <svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2zm-2 1H8v-6c0-2.48 1.51-4.5 4-4.5s4 2.02 4 4.5v6z"/></svg>
    <span>Alerts</span>
  </button>
</nav>

<!-- Floating Glass Toast -->
<div class="floating-toast" id="toastBox">
  <span id="toastIcon">📍</span>
  <span id="toastText">Location Info</span>
</div>

<!-- Announcements Modal -->
<div class="modal-overlay" id="notifModal">
  <div class="modal-card">

// Live Status Capsule Tracker
function updateLiveTracker() {
  const now = new Date();
  document.getElementById("liveClock").textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

  const dot = document.getElementById("liveDot");
  const text = document.getElementById("liveText");

  const todayZero = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startZero = new Date(ACADEMIC_YEAR_START.getFullYear(), ACADEMIC_YEAR_START.getMonth(), ACADEMIC_YEAR_START.getDate());
  const diffDays = Math.round((startZero - todayZero) / (1000 * 60 * 60 * 24));

  if (diffDays > 0) {
    dot.className = "live-indicator idle";
    text.innerHTML = `Summer Vacation · <strong>Starts in ${diffDays}d (19 Sep 2026)</strong>`;
    return;
  }

  const dayIndex = now.getDay();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();

  if (dayIndex === 5 || dayIndex === 6) {
    dot.className = "live-indicator idle";
    text.innerHTML = "Weekend · <strong>No classes scheduled today</strong>";
    return;
  }

  const todayName = DAYS[dayIndex].full;
  const todaySessions = SESSIONS.filter(s => s.day === todayName && (s.group === "ALL" || s.group === activeGroup))
                                .sort((a, b) => a.start - b.start);

  if (todaySessions.length === 0) {
    dot.className = "live-indicator idle";
    text.innerHTML = `No classes scheduled today (${todayName})`;
    return;
  }

  let activeSession = null;
  let nextSession = null;

  for (const s of todaySessions) {
    const startMin = parseMinutes(TIME_STARTS[s.start]);
    const endMin = parseMinutes(TIME_ENDS[s.start + s.span - 1]);

    if (currentMinutes >= startMin && currentMinutes < endMin) {
      activeSession = { ...s, remaining: endMin - currentMinutes };
      break;
    } else if (currentMinutes < startMin) {
      if (!nextSession) nextSession = { ...s, wait: startMin - currentMinutes };
    }
  }

  if (activeSession) {
    dot.className = "live-indicator";
    text.innerHTML = `Now: <strong>${activeSession.code}</strong> (${activeSession.remaining}m left)`;
  } else if (nextSession) {
    dot.className = "live-indicator idle";
    const hrs = Math.floor(nextSession.wait / 60);
    const mins = nextSession.wait % 60;
    text.innerHTML = `Next: <strong>${nextSession.code}</strong> in ${hrs > 0 ? hrs + 'h ' : ''}${mins}m`;
  } else {
    dot.className = "live-indicator idle";
    text.innerHTML = `Classes finished for ${todayName}`;
  }
}

function exportToCalendar() {
  triggerHaptic();
  const activeSessions = SESSIONS.filter(s => s.group === "ALL" || s.group === activeGroup);
  let ics = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Cairo University//ME1 Schedule//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    `X-WR-CALNAME:CUFE ME1 (${activeGroup})`,"X-WR-TIMEZONE:Africa/Cairo"
  ];
  const rruleDays = { "Sunday": "SU", "Monday": "MO", "Tuesday": "TU", "Wednesday": "WE", "Thursday": "TH" };
  const dayOffsets = { "Sunday": 1, "Monday": 2, "Tuesday": 3, "Wednesday": 4, "Thursday": 5 };

  activeSessions.forEach((s, idx) => {
    const course = COURSES[s.code] || { name: s.code };
    const sTime = TIME_STARTS[s.start].replace(":", "") + "00";
    const eTime = TIME_ENDS[s.start + s.span - 1].replace(":", "") + "00";
    ics.push("BEGIN:VEVENT");
    ics.push(`UID:cufe-me1-${activeGroup}-${idx}@eng.cu.edu.eg`);
    ics.push(`DTSTART;TZID=Africa/Cairo:202609${19 + dayOffsets[s.day]}T${sTime}`);
    ics.push(`DTEND;TZID=Africa/Cairo:202609${19 + dayOffsets[s.day]}T${eTime}`);
    ics.push(`RRULE:FREQ=WEEKLY;BYDAY=${rruleDays[s.day]}`);
    ics.push(`SUMMARY:${s.code} - ${s.type}`);
    ics.push(`LOCATION:${(ROOM_INFO[s.room] || s.room).replace(/,/g, "\\,")}`);
    ics.push("END:VEVENT");
  });
  ics.push("END:VCALENDAR");

  const blob = new Blob([ics.join("\r\n")], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `CUFE_ME1_${activeGroup}_Schedule.ics`;
  a.click();
}

  let html = `<div class="timeline-wrap" id="swipeArea">`;

  // Up Next Hero Card for Today
  const now = new Date();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();
  const isActualToday = (activeDay === todayDayName);

  if (isActualToday && daySessions.length > 0) {
    let nextHero = daySessions.find(s => parseMinutes(TIME_ENDS[s.start + s.span - 1]) > currentMinutes);
    if (nextHero) {
      const heroCourse = COURSES[nextHero.code] || { name: nextHero.code };
      const heroStartMin = parseMinutes(TIME_STARTS[nextHero.start]);
      const isNow = currentMinutes >= heroStartMin;
      html += `
        <div class="hero-card cascade-item">
          <div class="hero-top">
            <span class="hero-pill">${isNow ? '● In Progress' : '⚡ Up Next'}</span>
            <span class="hero-timer">${formatTime(nextHero.start, nextHero.span)}</span>
          </div>
          <div class="hero-title">${nextHero.code} — ${heroCourse.name}</div>
          <div class="hero-meta">
            <span class="hero-room-badge" onclick="showRoomDetails('${nextHero.room}')">📍 ${nextHero.room}</span>
            <span>${nextHero.type}</span>
          </div>
        </div>
      `;
    }
  }

  if (dayTasks.length > 0) {
    html += `
      <div class="day-assessment-banner cascade-item">
        <div>
          <strong>⚡ Assessment Alert Today:</strong> 
          ${dayTasks.map(t => `${t.type} in ${t.code} (${t.title})`).join(" · ")}
        </div>
        <button class="details-btn" onclick="openAssessmentModal('${activeDay}')">Details</button>
      </div>
    `;
  }

  if (daySessions.length === 0) {
    html += `
      <div class="cascade-item" style="background:var(--surface);border:1px dashed var(--border);border-radius:14px;padding:36px;text-align:center;color:var(--text-muted)">
        <h3>No classes scheduled for ${activeDay}</h3>
        <p style="font-size:12.5px;margin-top:4px">Enjoy your day off!</p>
      </div></div>`;
    container.innerHTML = html;
    return;
  }

  let timeLineInserted = false;

  for (let i = 0; i < daySessions.length; i++) {
    const s = daySessions[i];
    const course = COURSES[s.code] || { name: s.code, color: "var(--c-mth)" };
    const isShared = s.group === "ALL";
    const startMin = parseMinutes(TIME_STARTS[s.start]);
    const endMin = parseMinutes(TIME_ENDS[s.start + s.span - 1]);
    
    const isLive = isActualToday && (currentMinutes >= startMin && currentMinutes < endMin);
    const hasTask = dayTasks.some(t => t.code === s.code);
    const isDimmed = highlightedCourse && highlightedCourse !== s.code;
    const isHighlighted = highlightedCourse === s.code;

    if (isActualToday && !timeLineInserted && currentMinutes < startMin) {
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      html += `
        <div class="current-time-line cascade-item">
          <div class="time-line-tag">${timeStr} NOW</div>
          <div class="time-line-indicator"></div>
        </div>
      `;
      timeLineInserted = true;
    }

    if (i > 0) {
      const prevEnd = daySessions[i - 1].start + daySessions[i - 1].span;
      const gap = s.start - prevEnd;
      if (gap > 0) {
        html += `
          <div class="break-item cascade-item" style="animation-delay:${i * 0.04}s">
            <div class="break-spacer"></div>
            <div class="break-card">☕ Free Gap · ${gap * 50} mins</div>
          </div>`;
      }
    }

    html += `
      <div class="timeline-item cascade-item" style="animation-delay:${i * 0.05}s">
        <div class="time-col">
          <div class="time-start">${TIME_STARTS[s.start]}</div>
          <div class="time-end">${TIME_ENDS[s.start + s.span - 1]}</div>
          <span class="time-dur">${s.span * 50} mins</span>
        </div>
        <div class="rail">
          <div class="rail-dot" style="--c: ${course.color}"></div>
          <div class="rail-line"></div>
        </div>
        <div class="timeline-card ${isLive ? 'is-live' : ''} ${hasTask ? 'has-task-border' : ''} ${isDimmed ? 'dimmed' : ''} ${isHighlighted ? 'highlighted' : ''}" style="border-left: 4px solid ${course.color}">
          <div class="card-top">
            <span class="card-code" style="--c: ${course.color}">${s.code}</span>
            <div style="display:flex;gap:4px">
              ${hasTask ? `<span class="badge badge-task" onclick="openAssessmentModal('${activeDay}')" title="Click for details">⚡ QUIZ / DUE</span>` : ''}
              ${isLive ? '<span class="badge badge-live">● LIVE NOW</span>' : ''}
              ${isShared ? '<span class="badge badge-all">LEC · ALL</span>' : `<span class="badge badge-type">${s.type}</span>`}
            </div>
          </div>
          <div class="card-title">${course.name}</div>
          <div class="card-room-pill" onclick="showRoomDetails('${s.room}')">
            <span>🏛️</span>
            <span>${s.room}</span>
          </div>
        </div>
      </div>`;
  }
  html += `</div>`;
  container.innerHTML = html;

  attachSwipeListeners();
}

// Full Week Grid Matrix with Smooth Cascade
function renderWeekMatrix() {
  const container = document.getElementById("viewContainer");
  container.innerHTML = `
    <div class="matrix-wrapper cascade-item">
      <div class="matrix-scroll">
        <div class="matrix-grid" id="matrixGrid"></div>
      </div>
    </div>`;

  const grid = document.getElementById("matrixGrid");

  const corner = document.createElement("div");
  corner.className = "matrix-head corner";
  corner.textContent = "TIME";
  grid.appendChild(corner);

  DAYS.forEach((d, i) => {
    const isToday = (d.full === todayDayName);
    const dayTasks = getDayAssessments(d.full);
    const hasQuiz = dayTasks.length > 0;

    const head = document.createElement("div");
    head.className = "matrix-head" + (isToday ? " is-today" : "") + (hasQuiz ? " has-quiz-day" : "");
    head.style.gridColumn = `${i + 2}`;
    head.style.gridRow = "1";
    head.innerHTML = `
      <span>${d.full}</span> 
      <div style="display:flex;gap:3px">
        ${hasQuiz ? `<span class="quiz-pill" onclick="openAssessmentModal('${d.full}')" style="cursor:pointer;" title="Click for Quiz/Deadline Details">⚡ QUIZ</span>` : ''}
        ${isToday ? '<span class="today-pill">TODAY</span>' : ''}
      </div>
    `;
    grid.appendChild(head);
  });

  SLOTS.forEach((slot, s) => {
    const timeCell = document.createElement("div");
    timeCell.className = "matrix-time";
    timeCell.style.gridColumn = "1";
    timeCell.style.gridRow = `${s + 2}`;
    timeCell.textContent = slot;
    grid.appendChild(timeCell);
  });

  DAYS.forEach((d, dIdx) => {
    const col = dIdx + 2;
    const daySessions = SESSIONS.filter(s => s.day === d.full && (s.group === "ALL" || s.group === activeGroup))
                                .sort((a, b) => a.start - b.start);
    const dayTasks = getDayAssessments(d.full);

    let currentSlot = 0;
    daySessions.forEach(sess => {
      if (sess.start > currentSlot) {
        const freeSpan = sess.start - currentSlot;
        const freeCell = document.createElement("div");
        freeCell.className = "matrix-cell";
        freeCell.style.gridColumn = `${col}`;
        freeCell.style.gridRow = `${currentSlot + 2} / span ${freeSpan}`;
        freeCell.innerHTML = `<div class="cell-empty">—</div>`;
        grid.appendChild(freeCell);
      }

      const course = COURSES[sess.code] || { name: sess.code, color: "var(--c-mth)" };
      const isShared = sess.group === "ALL";
      const hasTask = dayTasks.some(t => t.code === sess.code);
      const isDimmed = highlightedCourse && highlightedCourse !== sess.code;
      const isHighlighted = highlightedCourse === sess.code;

      const cell = document.createElement("div");
      cell.className = "matrix-cell";
      cell.style.gridColumn = `${col}`;
      cell.style.gridRow = `${sess.start + 2} / span ${sess.span}`;
      cell.innerHTML = `
        <div class="grid-card ${hasTask ? 'has-task' : ''} ${isDimmed ? 'dimmed' : ''} ${isHighlighted ? 'highlighted' : ''}" style="--c: ${course.color}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span class="code">${sess.code}</span>
            <div style="display:flex;gap:3px">
              ${hasTask ? `<span class="type quiz-tag" onclick="openAssessmentModal('${d.full}')" title="Click for details">⚡ QUIZ</span>` : ''}
              <span class="type ${isShared ? 'all' : ''}">${isShared ? 'LEC · ALL' : sess.type}</span>
            </div>
          </div>
          <div class="title">${course.name}</div>
          <div class="footer">
            <span>${formatTime(sess.start, sess.span)}</span>
            <span class="room-badge" onclick="showRoomDetails('${sess.room}')">${sess.room}</span>
          </div>
        </div>`;
      grid.appendChild(cell);
      currentSlot = sess.start + sess.span;
    });

    if (currentSlot < 8) {
      const freeCell = document.createElement("div");
      freeCell.className = "matrix-cell";
      freeCell.style.gridColumn = `${col}`;
      freeCell.style.gridRow = `${currentSlot + 2} / span ${8 - currentSlot}`;
      freeCell.innerHTML = `<div class="cell-empty">—</div>`;
      grid.appendChild(freeCell);
    }
  });
}

function renderDaysBar() {
  const bar = document.getElementById("daysBar");
  if (activeView === "week" || activeView === "drive") {
    bar.style.display = "none";
    return;
  }
  bar.style.display = "grid";

  const today = new Date();
  const currentDayOfWeek = today.getDay();
  const sunday = new Date(today);
  sunday.setDate(today.getDate() - currentDayOfWeek);

  bar.innerHTML = DAYS.map((d, idx) => {
    const dayDate = new Date(sunday);
    dayDate.setDate(sunday.getDate() + idx);
    const dateNum = dayDate.getDate();

    const isToday = (d.full === todayDayName);
    const dayTasks = getDayAssessments(d.full);
    const hasQuiz = dayTasks.length > 0;

    return `
      <button class="day-btn ${d.full === activeDay ? 'active' : ''} ${hasQuiz ? 'has-quiz' : ''}" onclick="selectDay('${d.full}')">
        <span class="day-name">${d.short}</span>
        <span class="day-num">${dateNum}</span>
        ${hasQuiz ? '<span class="quiz-badge-dot">⚡ QUIZ</span>' : (isToday ? '<span class="today-tag">TODAY</span>' : '')}
      </button>`;
  }).join("");
}

let touchStartX = 0;
let touchEndX = 0;

function attachSwipeListeners() {
  const swipeArea = document.getElementById("swipeArea");
  if (!swipeArea) return;

  swipeArea.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });

  swipeArea.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipeGesture();
  }, { passive: true });
}

function handleSwipeGesture() {
  const diff = touchEndX - touchStartX;
  if (Math.abs(diff) < 45) return;

  const currentIndex = DAYS.findIndex(d => d.full === activeDay);
  if (diff < 0 && currentIndex < DAYS.length - 1) {
    selectDay(DAYS[currentIndex + 1].full);
  } else if (diff > 0 && currentIndex > 0) {
    selectDay(DAYS[currentIndex - 1].full);
  }
}

function renderLegend() {
  const legend = document.getElementById("legend");
  if (activeView === "drive") {
    legend.style.display = "none";
    return;
  }
  legend.style.display = "flex";
  legend.innerHTML = `
    <span class="legend-hint">Filter Subject:</span>
    ${Object.entries(COURSES).map(([code, c]) => `
      <div class="legend-item ${highlightedCourse === code ? 'active' : ''}" onclick="toggleHighlight('${code}')">
        <span class="legend-dot" style="background:${c.color}"></span>
        <b>${code}</b> <span style="font-size:11px">${c.name}</span>
      </div>
    `).join("")}
  `;
}

function toggleHighlight(code) {
  triggerHaptic();
  highlightedCourse = (highlightedCourse === code) ? null : code;
  renderLegend();
  if (activeView === "week") {
    renderWeekMatrix();
  } else if (activeView === "day") {
    renderDailyAgenda();
  }
}

function render() {
  renderDaysBar();
  initAssessments();
  renderLegend();

  const controlBar = document.getElementById("scheduleControlBar");
  const liveBox = document.getElementById("liveStatusBox");

  document.getElementById("navWeekBtn").classList.remove("active");
  document.getElementById("navDayBtn").classList.remove("active");
  document.getElementById("navDriveBtn").classList.remove("active");

  if (activeView === "drive") {
    controlBar.style.display = "none";
    liveBox.style.display = "none";
    document.getElementById("navDriveBtn").classList.add("active");
    renderDriveScreen();
  } else {
    controlBar.style.display = "flex";
    liveBox.style.display = "flex";

    if (activeView === "week") {
      document.getElementById("navWeekBtn").classList.add("active");
      renderWeekMatrix();
    } else {
      document.getElementById("navDayBtn").classList.add("active");
      renderDailyAgenda();
    }
  }

  updateLiveTracker();
  updateAcademicCalendarInfo();
}

function setView(mode) {
  triggerHaptic();
  activeView = mode;
  render();
}

function selectDay(day) {
  triggerHaptic();
  activeDay = day;
  renderDaysBar();
  renderDailyAgenda();
}

document.getElementById("sectionSelect").addEventListener("change", (e) => {
  triggerHaptic();
  activeGroup = e.target.value;
  render();
});

function initDeviceMode() {
  const saved = localStorage.getItem("cufe_device_mode") || "mobile";
  setDeviceMode(saved);
}

function setDeviceMode(mode) {
  const container = document.getElementById("mainContainer");
  const btn = document.getElementById("deviceModeBtn");
  const icon = document.getElementById("deviceModeIcon");
  const text = document.getElementById("deviceModeText");

  if (mode === "pc") {
    container.classList.add("pc-mode");
    btn.classList.add("active-mode");
    icon.textContent = "📱";
    text.textContent = "Mobile View";
    localStorage.setItem("cufe_device_mode", "pc");
  } else {
    container.classList.remove("pc-mode");
    btn.classList.remove("active-mode");
    icon.textContent = "💻";
    text.textContent = "PC View";
    localStorage.setItem("cufe_device_mode", "mobile");
  }
}

document.getElementById("deviceModeBtn").addEventListener("click", () => {
  triggerHaptic();
  const isPc = document.getElementById("mainContainer").classList.contains("pc-mode");
  setDeviceMode(isPc ? "mobile" : "pc");
});

function initTheme() {
  const saved = localStorage.getItem("cufe_theme") || "dark";
  document.documentElement.setAttribute("data-theme", saved);
}

document.getElementById("themeBtn").addEventListener("click", () => {
  triggerHaptic();
  const current = document.documentElement.getAttribute("data-theme") || "dark";
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("cufe_theme", next);
});

document.getElementById("printBtn").addEventListener("click", () => {
  triggerHaptic();
  document.body.classList.remove("print-day-mode", "print-week-mode");

  let printStyle = document.getElementById("dynamicPrintPageRule");
  if (!printStyle) {
    printStyle = document.createElement("style");
    printStyle.id = "dynamicPrintPageRule";
    document.head.appendChild(printStyle);
  }

  if (activeView === "day") {
    document.body.classList.add("print-day-mode");
    printStyle.innerHTML = "@page { size: A4 portrait !important; margin: 10mm !important; }";
  } else {
    document.body.classList.add("print-week-mode");
    printStyle.innerHTML = "@page { size: A4 landscape !important; margin: 8mm !important; }";
  }

  window.print();
});

document.getElementById("calendarBtn").addEventListener("click", exportToCalendar);

let deferredPrompt;
const topInstallBtn = document.getElementById('pwaTopInstallBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (topInstallBtn) topInstallBtn.style.display = 'inline-flex';
});

async function triggerPwaInstall() {
  triggerHaptic();
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      if (topInstallBtn) topInstallBtn.style.display = 'none';
    }
    deferredPrompt = null;
  }
}

if (topInstallBtn) topInstallBtn.addEventListener('click', triggerPwaInstall);

window.addEventListener('appinstalled', () => {
  if (topInstallBtn) topInstallBtn.style.display = 'none';
  deferredPrompt = null;
});

// Init
initDeviceMode();
initTheme();
initNotifications();
render();
setInterval(updateLiveTracker, 60000);
</script>
