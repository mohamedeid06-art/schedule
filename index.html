<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CUFE · Mechanical Engineering — Batch 30</title>

<!-- PWA Manifest & Icons -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ME-1 Engine">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" type="image/svg+xml" href="icon.svg">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  /* Industrial Blueprint Palette (Matte Charcoal & Studio Slate) */
  --bg: #090d12;
  --surface: #0f151e;
  --surface-alt: #161e2b;
  --surface-glass: rgba(15, 21, 30, 0.88);
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.16);
  --border-focus: #38bdf8;
  
  --text-main: #f1f5f9;
  --text-muted: #94a3b8;
  --text-subtle: #475569;
  
  --accent: #0284c7;
  --accent-light: #38bdf8;
  --accent-glow: rgba(56, 189, 248, 0.12);
  
  --quiz-color: #f97316;
  --quiz-glow: rgba(249, 115, 22, 0.14);

  --c-gen: #38bdf8;
  --c-mth: #0ea5e9;
  --c-emc: #6366f1;
  --c-mdp1: #14b8a6;
  --c-mdp2: #0284c7;
  --c-epe: #f43f5e;
}

[data-theme="light"] {
  --bg: #f8fafc;
  --surface: #ffffff;
  --surface-alt: #f1f5f9;
  --surface-glass: rgba(255, 255, 255, 0.92);
  --border: rgba(15, 23, 42, 0.09);
  --border-strong: rgba(15, 23, 42, 0.18);
  --border-focus: #0284c7;
  
  --text-main: #0f172a;
  --text-muted: #64748b;
  --text-subtle: #94a3b8;
  
  --accent: #0284c7;
  --accent-light: #0369a1;
  --accent-glow: rgba(2, 132, 199, 0.1);
  
  --quiz-color: #ea580c;
  --quiz-glow: rgba(234, 88, 12, 0.1);
}

*{box-sizing:border-box;margin:0;padding:0;}

body {
  background-color: var(--bg);
  color: var(--text-main);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  min-height: 100vh;
  padding: 14px 12px 105px;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.2s ease, color 0.2s ease;
}

.container {
  max-width: 480px;
  margin: 0 auto;
  transition: max-width 0.25s cubic-bezier(0.16, 1, 0.3, 1);
}

.container.pc-mode {
  max-width: 1240px;
}

/* Institutional Enterprise Masthead */
.masthead {
  border-bottom: 1px solid var(--border);
  padding-bottom: 12px;
  margin-bottom: 14px;
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  flex-wrap: wrap;
  gap: 12px;
}

.institutional-badge-strip {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--accent-light);
  text-transform: uppercase;
}
.inst-dot {
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent-light);
}

.dept-title-group {
  margin-top: 4px;
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.dept-title {
  font-size: 21px;
  font-weight: 800;
  color: var(--text-main);
  letter-spacing: -0.03em;
}
.batch-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--surface-alt);
  color: var(--text-muted);
  border: 1px solid var(--border);
  letter-spacing: 0.04em;
}
.container.pc-mode .dept-title {
  font-size: 26px;
}

.date-academic-strip {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  font-size: 11.5px;
  color: var(--text-muted);
  font-family: 'JetBrains Mono', monospace;
}
.academic-week-badge {
  font-size: 9.5px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--accent-glow);
  color: var(--accent-light);
  border: 1px solid var(--accent);
}

/* Actions Toolbar */
.top-actions {
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
}
.action-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-muted);
  height: 34px;
  padding: 0 10px;
  border-radius: 6px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.action-btn.icon-only {
  width: 34px;
  padding: 0;
  justify-content: center;
}
.action-btn:hover {
  color: var(--text-main);
  border-color: var(--border-strong);
}
.action-btn.active-mode {
  background: var(--surface-alt);
  color: var(--accent-light);
  border-color: var(--accent);
}
.action-btn.install-btn {
  background: var(--accent);
  color: #ffffff;
  border-color: var(--accent);
  display: none;
}
.action-btn.install-btn:hover {
  opacity: 0.9;
}
.micro-icon {
  width: 14px;
  height: 14px;
  stroke-width: 1.75;
  stroke: currentColor;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* System Engine Status Capsule */
.system-status-capsule {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 11.5px;
}
.live-left {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.live-pulse-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #10b981;
  box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
  flex-shrink: 0;
}
.live-pulse-dot.idle {
  background: #64748b;
  box-shadow: none;
}
.live-text {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-muted);
}
.live-text strong {
  color: var(--text-main);
  font-weight: 600;
}
.live-time-now {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--accent-light);
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

/* Up Next Technical Block */
.hero-block {
  background: var(--surface);
  border: 1px solid var(--border-strong);
  border-left: 3px solid var(--accent-light);
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.hero-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.hero-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--accent-light);
}
.hero-time {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.hero-course-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-main);
  line-height: 1.35;
}
.hero-footer {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 2px;
}
.hero-room-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  padding: 2px 7px;
  border-radius: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  color: var(--text-main);
  cursor: pointer;
}

/* Control Bar */
.control-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
.group-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  justify-content: space-between;
}
.control-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.section-select {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-main);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11.5px;
  font-weight: 600;
  padding: 5px 10px;
  border-radius: 6px;
  outline: none;
  cursor: pointer;
}

/* Industrial Segmented Date Strip */
.days-bar {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 3px;
  border-radius: 8px;
  margin-bottom: 14px;
}
.day-btn {
  border: 1px solid transparent;
  background: transparent;
  padding: 6px 2px;
  border-radius: 5px;
  cursor: pointer;
  text-align: center;
  transition: all 0.15s ease;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}
.day-btn .day-name {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-weight: 700;
  color: var(--text-muted);
  letter-spacing: 0.04em;
}
.day-btn .day-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text-main);
  font-variant-numeric: tabular-nums;
}
.day-btn .today-tag {
  font-family: 'JetBrains Mono', monospace;
  font-size: 7.5px;
  font-weight: 800;
  color: var(--accent-light);
}
.day-btn.has-quiz {
  border-color: var(--quiz-color);
  background: var(--quiz-glow);
}
.day-btn.has-quiz .quiz-badge-dot {
  font-family: 'JetBrains Mono', monospace;
  font-size: 7.5px;
  font-weight: 800;
  color: var(--quiz-color);
}
.day-btn.active {
  background: var(--surface-alt);
  border-color: var(--border-strong);
}
.day-btn.active .day-name,
.day-btn.active .day-num {
  color: var(--accent-light);
}

/* Alert Banner */
.day-assessment-banner {
  background: var(--quiz-glow);
  border: 1px solid var(--quiz-color);
  border-radius: 6px;
  padding: 8px 12px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  font-size: 11.5px;
}
.day-assessment-banner strong {
  color: var(--quiz-color);
}
.details-btn {
  background: var(--quiz-color);
  color: #fff;
  border: none;
  padding: 3px 8px;
  border-radius: 4px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 700;
  cursor: pointer;
  white-space: nowrap;
}

/* Timeline Layout */
.timeline-wrap {
  display: flex;
  flex-direction: column;
  gap: 12px;
  touch-action: pan-y;
  position: relative;
}
.timeline-item {
  display: flex;
  gap: 12px;
  position: relative;
}
.time-col {
  width: 76px;
  flex-shrink: 0;
  text-align: right;
  padding-top: 2px;
}
.time-start {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--text-main);
  font-variant-numeric: tabular-nums;
}
.time-end {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  color: var(--text-muted);
  margin-top: 1px;
  font-variant-numeric: tabular-nums;
}
.time-dur {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 8.5px;
  font-weight: 600;
  background: var(--surface-alt);
  color: var(--text-muted);
  padding: 1px 4px;
  border-radius: 3px;
  margin-top: 3px;
}
.rail {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.rail-dot {
  width: 9px;
  height: 9px;
  border-radius: 2px;
  border: 1.5px solid var(--c);
  background: var(--bg);
  z-index: 2;
  margin-top: 5px;
}
.rail-line {
  position: absolute;
  top: 15px;
  bottom: -18px;
  width: 1px;
  background: var(--border);
}
.timeline-item:last-child .rail-line { display: none; }

/* Current Time Indicator Line */
.current-time-line {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 3px 0;
  z-index: 10;
}
.time-line-tag {
  width: 76px;
  text-align: right;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-weight: 800;
  color: #ef4444;
  font-variant-numeric: tabular-nums;
}
.time-line-indicator {
  flex: 1;
  height: 1.5px;
  background: #ef4444;
  position: relative;
}
.time-line-indicator::before {
  content: '';
  position: absolute;
  left: -3px;
  top: -2.5px;
  width: 6px;
  height: 6px;
  background: #ef4444;
  border-radius: 50%;
}

/* Industrial Action Card */
.timeline-card {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 13px;
  position: relative;
  transition: border-color 0.15s ease;
}
.timeline-card.is-live {
  border-color: #10b981;
}
.timeline-card.has-task-border {
  border-color: var(--quiz-color);
}
.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 4px;
}
.card-code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  color: var(--c);
}
.badge {
  font-family: 'JetBrains Mono', monospace;
  font-size: 8.5px;
  font-weight: 700;
  padding: 1px 5px;
  border-radius: 3px;
  text-transform: uppercase;
}
.badge-type { background: var(--surface-alt); color: var(--text-muted); }
.badge-all { background: var(--accent-glow); color: var(--accent-light); }
.badge-live { background: rgba(16, 185, 129, 0.15); color: #10b981; }
.badge-task { background: var(--quiz-color); color: #ffffff; cursor: pointer; }

.card-title {
  font-size: 12.5px;
  font-weight: 600;
  color: var(--text-main);
  line-height: 1.35;
  margin-bottom: 8px;
}
.card-room-pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  font-weight: 600;
  background: var(--surface-alt);
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 3px 7px;
  border-radius: 4px;
  cursor: pointer;
  transition: all 0.15s ease;
}
.card-room-pill:hover {
  color: var(--text-main);
  border-color: var(--border-strong);
}

/* Preserved Free Gap Coffee Card */
.break-item {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: -3px 0;
}
.break-spacer { width: 76px; flex-shrink: 0; }
.break-card {
  flex: 1;
  border: 1px dashed var(--border);
  background: var(--surface-alt);
  border-radius: 6px;
  padding: 6px 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 500;
}

/* Week Grid Matrix */
.matrix-wrapper {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.matrix-scroll {
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}
.matrix-grid {
  display: grid;
  grid-template-columns: 76px repeat(5, minmax(170px, 1fr));
  grid-template-rows: 34px repeat(8, minmax(68px, auto));
  min-width: 920px;
}
.matrix-head {
  background: var(--surface-alt);
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding: 6px 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.matrix-head.corner {
  justify-content: center;
  font-size: 9.5px;
  color: var(--text-muted);
}
.matrix-head.is-today {
  background: var(--accent-glow);
  color: var(--accent-light);
}
.matrix-head.has-quiz-day {
  border-top: 2px solid var(--quiz-color);
}
.matrix-head .today-pill,
.matrix-head .quiz-pill {
  font-size: 7.5px;
  font-weight: 800;
  padding: 1px 4px;
  border-radius: 2px;
}
.matrix-head .today-pill { background: var(--accent); color: #fff; }
.matrix-head .quiz-pill { background: var(--quiz-color); color: #fff; }
.matrix-time {
  background: var(--surface-alt);
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9.5px;
  font-weight: 600;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
}
.matrix-cell {
  border-bottom: 1px solid var(--border);
  border-right: 1px solid var(--border);
  padding: 3px;
  display: flex;
  flex-direction: column;
}
.grid-card {
  height: 100%;
  border-radius: 5px;
  padding: 5px 7px;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 3px solid var(--c);
}
.grid-card.has-task { border-color: var(--quiz-color); }
.grid-card .code {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-main);
}
.grid-card .type {
  font-family: 'JetBrains Mono', monospace;
  font-size: 7.5px;
  font-weight: 700;
  padding: 1px 3px;
  border-radius: 2px;
  background: var(--surface-alt);
  color: var(--text-muted);
  text-transform: uppercase;
}
.grid-card .type.all { background: var(--accent-glow); color: var(--accent-light); }
.grid-card .type.quiz-tag { background: var(--quiz-color); color: #fff; }
.grid-card .title {
  font-size: 9.5px;
  color: var(--text-muted);
  margin-top: 2px;
  line-height: 1.25;
}
.grid-card .footer {
  margin-top: auto;
  padding-top: 3px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 8.5px;
  color: var(--text-muted);
  border-top: 1px dashed var(--border);
  font-variant-numeric: tabular-nums;
}
.room-badge {
  background: var(--surface-alt);
  padding: 1px 4px;
  border-radius: 3px;
  color: var(--text-main);
  font-weight: 600;
  cursor: pointer;
}
.cell-empty {
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: var(--text-subtle);
}

/* Dedicated In-App Drive View */
.drive-view-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.drive-header-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.drive-header-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--text-main);
  display: flex;
  align-items: center;
  gap: 6px;
}
.drive-header-desc {
  font-size: 11.5px;
  color: var(--text-muted);
  line-height: 1.4;
}
.drive-main-link-btn {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--accent-glow);
  border: 1px solid var(--accent);
  color: var(--accent-light);
  padding: 10px 12px;
  border-radius: 6px;
  font-size: 11.5px;
  font-weight: 600;
  text-decoration: none;
}
.course-accordion {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.course-accordion.open {
  border-color: var(--border-strong);
}
.accordion-header {
  padding: 12px;
  display: flex;

.sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);

  z-index: 1000;
  display: flex;
  align-items: flex-end;
  justify-content: center;

  pointer-events: none;

}
.sheet-overlay.open {
  opacity: 1;

}
.bottom-sheet {

  max-width: 500px;

  align-items: center;

  align-items: center;
  justify-content: center;

.sheet-body {

  flex-direction: column;
  gap: 10px;

}
.sheet-item-body {

/* Modern Minimalist Toast */
.minimal-toast {

  border: 1px solid var(--border-strong);

// System Status Tracker
function updateLiveTracker() {
  const now = new Date();
  document.getElementById("liveClock").textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

  const dot = document.getElementById("liveDot");
  const text = document.getElementById("liveText");

  const todayZero = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const startZero = new Date(ACADEMIC_YEAR_START.getFullYear(), ACADEMIC_YEAR_START.getMonth(), ACADEMIC_YEAR_START.getDate());
  const diffDays = Math.round((startZero - todayZero) / (1000 * 60 * 60 * 24));

  if (diffDays > 0) {
    dot.className = "live-pulse-dot idle";
    text.innerHTML = `RECESS: <strong>Term commences in ${diffDays} days (19/09/2026)</strong>`;
    return;
  }

  const dayIndex = now.getDay();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();

  if (dayIndex === 5 || dayIndex === 6) {
    dot.className = "live-pulse-dot idle";
    text.innerHTML = "WEEKEND: <strong>No operations scheduled</strong>";
    return;
  }

  const todayName = DAYS[dayIndex].full;
  const todaySessions = SESSIONS.filter(s => s.day === todayName && (s.group === "ALL" || s.group === activeGroup))
                                .sort((a, b) => a.start - b.start);

  if (todaySessions.length === 0) {
    dot.className = "live-pulse-dot idle";
    text.innerHTML = `STANDBY: No sessions logged for ${todayName}`;
    return;
  }

  let activeSession = null;
  let nextSession = null;

  for (const s of todaySessions) {
    const startMin = parseMinutes(TIME_STARTS[s.start]);
    const endMin = parseMinutes(TIME_ENDS[s.start + s.span - 1]);

    if (currentMinutes >= startMin && currentMinutes < endMin) {
      activeSession = { ...s, remaining: endMin - currentMinutes };
      break;
    } else if (currentMinutes < startMin) {
      if (!nextSession) nextSession = { ...s, wait: startMin - currentMinutes };
    }
  }

  if (activeSession) {
    dot.className = "live-pulse-dot";
    text.innerHTML = `ACTIVE: <strong>${activeSession.code}</strong> // ${activeSession.room} (${activeSession.remaining}m left)`;
  } else if (nextSession) {
    dot.className = "live-pulse-dot idle";
    const hrs = Math.floor(nextSession.wait / 60);
    const mins = nextSession.wait % 60;
    text.innerHTML = `UP NEXT: <strong>${nextSession.code}</strong> in ${hrs > 0 ? hrs + 'h ' : ''}${mins}m`;
  } else {
    dot.className = "live-pulse-dot idle";
    text.innerHTML = `COMPLETE: Sessions concluded for ${todayName}`;
  }
}

function exportToCalendar() {
  triggerHaptic();
  const activeSessions = SESSIONS.filter(s => s.group === "ALL" || s.group === activeGroup);
  let ics = [
    "BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Cairo University//ME1 Schedule//EN","CALSCALE:GREGORIAN","METHOD:PUBLISH",
    `X-WR-CALNAME:CUFE ME1 (${activeGroup})`,"X-WR-TIMEZONE:Africa/Cairo"
  ];
  const rruleDays = { "Sunday": "SU", "Monday": "MO", "Tuesday": "TU", "Wednesday": "WE", "Thursday": "TH" };
  const dayOffsets = { "Sunday": 1, "Monday": 2, "Tuesday": 3, "Wednesday": 4, "Thursday": 5 };

  activeSessions.forEach((s, idx) => {
    const course = COURSES[s.code] || { name: s.code };
    const sTime = TIME_STARTS[s.start].replace(":", "") + "00";
    const eTime = TIME_ENDS[s.start + s.span - 1].replace(":", "") + "00";
    ics.push("BEGIN:VEVENT");
    ics.push(`UID:cufe-me1-${activeGroup}-${idx}@eng.cu.edu.eg`);
    ics.push(`DTSTART;TZID=Africa/Cairo:202609${19 + dayOffsets[s.day]}T${sTime}`);
    ics.push(`DTEND;TZID=Africa/Cairo:202609${19 + dayOffsets[s.day]}T${eTime}`);
    ics.push(`RRULE:FREQ=WEEKLY;BYDAY=${rruleDays[s.day]}`);
    ics.push(`SUMMARY:${s.code} - ${s.type}`);
    ics.push(`LOCATION:${(ROOM_INFO[s.room] || s.room).replace(/,/g, "\\,")}`);
    ics.push("END:VEVENT");
  });
  ics.push("END:VCALENDAR");

  const blob = new Blob([ics.join("\r\n")], { type: "text/calendar;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `CUFE_ME1_${activeGroup}_Schedule.ics`;
  a.click();
}

// Daily View with Up Next Hero Block & Preserved Free Gap Coffee Card
function renderDailyAgenda() {
  const container = document.getElementById("viewContainer");
  const daySessions = SESSIONS.filter(s => s.day === activeDay && (s.group === "ALL" || s.group === activeGroup))
                              .sort((a, b) => a.start - b.start);

  const dayTasks = getDayAssessments(activeDay);

  let html = `<div class="timeline-wrap" id="swipeArea">`;

  // Industrial Hero Block for Current Day
  const now = new Date();
  const currentMinutes = now.getHours() * 60 + now.getMinutes();
  const isActualToday = (activeDay === todayDayName);

  if (isActualToday && daySessions.length > 0) {
    let nextHero = daySessions.find(s => parseMinutes(TIME_ENDS[s.start + s.span - 1]) > currentMinutes);
    if (nextHero) {
      const heroCourse = COURSES[nextHero.code] || { name: nextHero.code };
      const heroStartMin = parseMinutes(TIME_STARTS[nextHero.start]);
      const isNow = currentMinutes >= heroStartMin;
      html += `
        <div class="hero-block">
          <div class="hero-top">
            <span class="hero-label">${isNow ? 'CURRENTLY ACTIVE' : 'UPCOMING SESSION'}</span>
            <span class="hero-time">${formatTime(nextHero.start, nextHero.span)}</span>
          </div>
          <div class="hero-course-title">${nextHero.code} — ${heroCourse.name}</div>
          <div class="hero-footer">
            <span class="hero-room-badge" onclick="showRoomDetails('${nextHero.room}')">

          </div>
        </div>
      `;
    }
  }

  if (dayTasks.length > 0) {
    html += `
      <div class="day-assessment-banner">
        <div>
          <strong>DEADLINE NOTICE:</strong> 
          ${dayTasks.map(t => `${t.type} in ${t.code} (${t.title})`).join(" // ")}

  if (daySessions.length === 0) {
    html += `

        NO SESSIONS LOGGED FOR ${activeDay.toUpperCase()}
      </div></div>`;
    container.innerHTML = html;
    return;
  }

  let timeLineInserted = false;

  for (let i = 0; i < daySessions.length; i++) {
    const s = daySessions[i];
    const course = COURSES[s.code] || { name: s.code, color: "var(--c-mth)" };
    const isShared = s.group === "ALL";
    const startMin = parseMinutes(TIME_STARTS[s.start]);

    const isLive = isActualToday && (currentMinutes >= startMin && currentMinutes < endMin);
    const hasTask = dayTasks.some(t => t.code === s.code);
    const isDimmed = highlightedCourse && highlightedCourse !== s.code;
    const isHighlighted = highlightedCourse === s.code;

    if (isActualToday && !timeLineInserted && currentMinutes < startMin) {
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });

        </div>
      `;
      timeLineInserted = true;
    }

    // Preserved Coffee Gap
    if (i > 0) {
      const prevEnd = daySessions[i - 1].start + daySessions[i - 1].span;
      const gap = s.start - prevEnd;
      if (gap > 0) {
        html += `
          <div class="break-item">
            <div class="break-spacer"></div>

        <div class="time-col">
          <div class="time-start">${TIME_STARTS[s.start]}</div>
          <div class="time-end">${TIME_ENDS[s.start + s.span - 1]}</div>

          <div class="card-top">
            <span class="card-code" style="--c: ${course.color}">${s.code}</span>
            <div style="display:flex;gap:4px">
              ${hasTask ? `<span class="badge badge-task" onclick="openAssessmentSheet()">DUE / QUIZ</span>` : ''}
              ${isLive ? '<span class="badge badge-live">ACTIVE NOW</span>' : ''}
              ${isShared ? '<span class="badge badge-all">LEC // ALL</span>' : `<span class="badge badge-type">${s.type}</span>`}
            </div>
          </div>
          <div class="card-title">${course.name}</div>
          <div class="card-room-pill" onclick="showRoomDetails('${s.room}')">
            <svg class="micro-icon" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span>${s.room}</span>
          </div>
        </div>
      </div>`;
  }
  html += `</div>`;
  container.innerHTML = html;

  attachSwipeListeners();
}

// Week Grid Matrix
function renderWeekMatrix() {
  const container = document.getElementById("viewContainer");
  container.innerHTML = `
    <div class="matrix-wrapper">
      <div class="matrix-scroll">
        <div class="matrix-grid" id="matrixGrid"></div>
      </div>
    </div>`;

  const grid = document.getElementById("matrixGrid");

  const corner = document.createElement("div");
  corner.className = "matrix-head corner";
  corner.textContent = "TIME";
  grid.appendChild(corner);

  DAYS.forEach((d, i) => {
    const isToday = (d.full === todayDayName);
    const dayTasks = getDayAssessments(d.full);
    const hasQuiz = dayTasks.length > 0;

    const head = document.createElement("div");
    head.className = "matrix-head" + (isToday ? " is-today" : "") + (hasQuiz ? " has-quiz-day" : "");
    head.style.gridColumn = `${i + 2}`;
    head.style.gridRow = "1";
    head.innerHTML = `
      <span>${d.full.toUpperCase()}</span> 
      <div style="display:flex;gap:3px">
        ${hasQuiz ? `<span class="quiz-pill" onclick="openAssessmentSheet()" style="cursor:pointer;" title="View Tasks">QUIZ</span>` : ''}
        ${isToday ? '<span class="today-pill">TODAY</span>' : ''}
      </div>
    `;
    grid.appendChild(head);
  });

  SLOTS.forEach((slot, s) => {
    const timeCell = document.createElement("div");
    timeCell.className = "matrix-time";
    timeCell.style.gridColumn = "1";
    timeCell.style.gridRow = `${s + 2}`;
    timeCell.textContent = slot;
    grid.appendChild(timeCell);
  });

  DAYS.forEach((d, dIdx) => {
    const col = dIdx + 2;
    const daySessions = SESSIONS.filter(s => s.day === d.full && (s.group === "ALL" || s.group === activeGroup))
                                .sort((a, b) => a.start - b.start);
    const dayTasks = getDayAssessments(d.full);

    let currentSlot = 0;
    daySessions.forEach(sess => {
      if (sess.start > currentSlot) {
        const freeSpan = sess.start - currentSlot;
        const freeCell = document.createElement("div");
        freeCell.className = "matrix-cell";
        freeCell.style.gridColumn = `${col}`;
        freeCell.style.gridRow = `${currentSlot + 2} / span ${freeSpan}`;
        freeCell.innerHTML = `<div class="cell-empty">—</div>`;
        grid.appendChild(freeCell);
      }

      const course = COURSES[sess.code] || { name: sess.code, color: "var(--c-mth)" };
      const isShared = sess.group === "ALL";
      const hasTask = dayTasks.some(t => t.code === sess.code);
      const isDimmed = highlightedCourse && highlightedCourse !== sess.code;
      const isHighlighted = highlightedCourse === sess.code;

      const cell = document.createElement("div");
      cell.className = "matrix-cell";
      cell.style.gridColumn = `${col}`;
      cell.style.gridRow = `${sess.start + 2} / span ${sess.span}`;
      cell.innerHTML = `
        <div class="grid-card ${hasTask ? 'has-task' : ''} ${isDimmed ? 'dimmed' : ''} ${isHighlighted ? 'highlighted' : ''}" style="--c: ${course.color}">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <span class="code">${sess.code}</span>
            <div style="display:flex;gap:3px">
              ${hasTask ? `<span class="type quiz-tag" onclick="openAssessmentSheet()">QUIZ</span>` : ''}
              <span class="type ${isShared ? 'all' : ''}">${isShared ? 'LEC' : sess.type.substring(0, 3)}</span>
            </div>
          </div>
          <div class="title">${course.name}</div>
          <div class="footer">
            <span>${formatTime(sess.start, sess.span)}</span>
            <span class="room-badge" onclick="showRoomDetails('${sess.room}')">${sess.room}</span>
          </div>
        </div>`;
      grid.appendChild(cell);
      currentSlot = sess.start + sess.span;
    });

    if (currentSlot < 8) {
      const freeCell = document.createElement("div");
      freeCell.className = "matrix-cell";
      freeCell.style.gridColumn = `${col}`;
      freeCell.style.gridRow = `${currentSlot + 2} / span ${8 - currentSlot}`;
      freeCell.innerHTML = `<div class="cell-empty">—</div>`;
      grid.appendChild(freeCell);
    }
  });
}

function renderDaysBar() {
  const bar = document.getElementById("daysBar");
  if (activeView === "week" || activeView === "drive") {
    bar.style.display = "none";
    return;
  }
  bar.style.display = "grid";

  const today = new Date();
  const currentDayOfWeek = today.getDay();
  const sunday = new Date(today);
  sunday.setDate(today.getDate() - currentDayOfWeek);

  bar.innerHTML = DAYS.map((d, idx) => {
    const dayDate = new Date(sunday);
    dayDate.setDate(sunday.getDate() + idx);
    const dateNum = dayDate.getDate();

    const isToday = (d.full === todayDayName);
    const dayTasks = getDayAssessments(d.full);
    const hasQuiz = dayTasks.length > 0;

    return `
      <button class="day-btn ${d.full === activeDay ? 'active' : ''} ${hasQuiz ? 'has-quiz' : ''}" onclick="selectDay('${d.full}')">
        <span class="day-name">${d.short}</span>
        <span class="day-num">${dateNum < 10 ? '0' + dateNum : dateNum}</span>
        ${hasQuiz ? '<span class="quiz-badge-dot">QUIZ</span>' : (isToday ? '<span class="today-tag">TODAY</span>' : '')}
      </button>`;
  }).join("");
}

let touchStartX = 0;
let touchEndX = 0;

function attachSwipeListeners() {
  const swipeArea = document.getElementById("swipeArea");
  if (!swipeArea) return;

  swipeArea.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });

  swipeArea.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipeGesture();
  }, { passive: true });
}

function handleSwipeGesture() {
  const diff = touchEndX - touchStartX;
  if (Math.abs(diff) < 45) return;

  const currentIndex = DAYS.findIndex(d => d.full === activeDay);
  if (diff < 0 && currentIndex < DAYS.length - 1) {
    selectDay(DAYS[currentIndex + 1].full);
  } else if (diff > 0 && currentIndex > 0) {
    selectDay(DAYS[currentIndex - 1].full);
  }
}

function renderLegend() {
  const legend = document.getElementById("legend");
  if (activeView === "drive") {
    legend.style.display = "none";
    return;
  }
  legend.style.display = "flex";
  legend.innerHTML = `
    <span class="legend-hint">FILTER:</span>
    ${Object.entries(COURSES).map(([code, c]) => `
      <div class="legend-item ${highlightedCourse === code ? 'active' : ''}" onclick="toggleHighlight('${code}')">
        <span class="legend-dot" style="background:${c.color}"></span>
        <b style="font-family:'JetBrains Mono',monospace">${code}</b> <span style="font-size:10.5px">${c.name}</span>
      </div>
    `).join("")}
  `;
}

function toggleHighlight(code) {
  triggerHaptic();
  highlightedCourse = (highlightedCourse === code) ? null : code;
  renderLegend();
  if (activeView === "week") {
    renderWeekMatrix();
  } else if (activeView === "day") {
    renderDailyAgenda();
  }
}

function render() {
  renderDaysBar();
  initAssessments();
  renderLegend();

  const controlBar = document.getElementById("scheduleControlBar");
  const liveBox = document.getElementById("liveStatusBox");

  document.getElementById("navWeekBtn").classList.remove("active");
  document.getElementById("navDayBtn").classList.remove("active");
  document.getElementById("navDriveBtn").classList.remove("active");

  if (activeView === "drive") {
    controlBar.style.display = "none";
    liveBox.style.display = "none";
    document.getElementById("navDriveBtn").classList.add("active");
    renderDriveScreen();
  } else {
    controlBar.style.display = "flex";
    liveBox.style.display = "flex";

    if (activeView === "week") {
      document.getElementById("navWeekBtn").classList.add("active");
      renderWeekMatrix();
    } else {
      document.getElementById("navDayBtn").classList.add("active");
      renderDailyAgenda();
    }
  }

  updateLiveTracker();
  updateAcademicCalendarInfo();
}

function setView(mode) {
  triggerHaptic();
  activeView = mode;
  render();
}

function selectDay(day) {
  triggerHaptic();
  activeDay = day;
  renderDaysBar();
  renderDailyAgenda();
}

document.getElementById("sectionSelect").addEventListener("change", (e) => {
  triggerHaptic();
  activeGroup = e.target.value;
  render();
});

function initDeviceMode() {
  const saved = localStorage.getItem("cufe_device_mode") || "mobile";
  setDeviceMode(saved);
}

function setDeviceMode(mode) {
  const container = document.getElementById("mainContainer");
  const btn = document.getElementById("deviceModeBtn");
  const text = document.getElementById("deviceModeText");

  if (mode === "pc") {
    container.classList.add("pc-mode");
    btn.classList.add("active-mode");
    text.textContent = "MOBILE";
    localStorage.setItem("cufe_device_mode", "pc");
  } else {
    container.classList.remove("pc-mode");
    btn.classList.remove("active-mode");
    text.textContent = "PC";
    localStorage.setItem("cufe_device_mode", "mobile");
  }
}

document.getElementById("deviceModeBtn").addEventListener("click", () => {
  triggerHaptic();
  const isPc = document.getElementById("mainContainer").classList.contains("pc-mode");
  setDeviceMode(isPc ? "mobile" : "pc");
});

function initTheme() {
  const saved = localStorage.getItem("cufe_theme") || "dark";
  document.documentElement.setAttribute("data-theme", saved);
}

document.getElementById("themeBtn").addEventListener("click", () => {
  triggerHaptic();
  const current = document.documentElement.getAttribute("data-theme") || "dark";
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("cufe_theme", next);
});

document.getElementById("printBtn").addEventListener("click", () => {
  triggerHaptic();
  document.body.classList.remove("print-day-mode", "print-week-mode");

  let printStyle = document.getElementById("dynamicPrintPageRule");
  if (!printStyle) {
    printStyle = document.createElement("style");
    printStyle.id = "dynamicPrintPageRule";
    document.head.appendChild(printStyle);
  }

  if (activeView === "day") {
    document.body.classList.add("print-day-mode");
    printStyle.innerHTML = "@page { size: A4 portrait !important; margin: 10mm !important; }";
  } else {
    document.body.classList.add("print-week-mode");
    printStyle.innerHTML = "@page { size: A4 landscape !important; margin: 8mm !important; }";
  }

  window.print();
});

document.getElementById("calendarBtn").addEventListener("click", exportToCalendar);

let deferredPrompt;
const topInstallBtn = document.getElementById('pwaTopInstallBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  if (topInstallBtn) topInstallBtn.style.display = 'inline-flex';
});

async function triggerPwaInstall() {
  triggerHaptic();
  if (deferredPrompt) {
    deferredPrompt.prompt();
    const { outcome } = await deferredPrompt.userChoice;
    if (outcome === 'accepted') {
      if (topInstallBtn) topInstallBtn.style.display = 'none';
    }
    deferredPrompt = null;
  }
}

if (topInstallBtn) topInstallBtn.addEventListener('click', triggerPwaInstall);

window.addEventListener('appinstalled', () => {
  if (topInstallBtn) topInstallBtn.style.display = 'none';
  deferredPrompt = null;
});

// Init
initDeviceMode();
initTheme();
initNotifications();
render();
setInterval(updateLiveTracker, 60000);
</script>
