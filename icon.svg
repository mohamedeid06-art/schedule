<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Gold Gradients -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff0a6"/>
      <stop offset="35%" stop-color="#e2b444"/>
      <stop offset="70%" stop-color="#b8861b"/>
      <stop offset="100%" stop-color="#7a5507"/>
    </linearGradient>

    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff8cc"/>
      <stop offset="100%" stop-color="#d4a32a"/>
    </linearGradient>

    <!-- Chrome / Steel Gradients for Piston -->
    <linearGradient id="steel-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="30%" stop-color="#cbd5e1"/>
      <stop offset="70%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <linearGradient id="steel-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Deep Blue Background -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#142442"/>
      <stop offset="75%" stop-color="#091224"/>
      <stop offset="100%" stop-color="#040813"/>
    </radialGradient>

    <!-- Arc Text Paths -->
    <path id="text-arc-top" d="M 72,256 A 184,184 0 0,1 440,256" fill="none"/>
    <path id="text-arc-bottom" d="M 80,265 A 176,176 0 0,0 432,265" fill="none"/>

    <!-- Gear Tooth -->
    <path id="gear-tooth" d="M -13,-90 L -9,-106 L 9,-106 L 13,-90 Z" fill="url(#gold)"/>
  </defs>

  <!-- Base Circle Background -->
  <circle cx="256" cy="256" r="252" fill="#040813"/>
  <circle cx="256" cy="256" r="248" fill="url(#bg-grad)"/>

  <!-- Outer Decorative Rings -->
  <circle cx="256" cy="256" r="244" fill="none" stroke="url(#gold)" stroke-width="6"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="256" cy="256" r="148" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="256" cy="256" r="142" fill="#060c18" stroke="url(#gold)" stroke-width="1"/>

  <!-- Text: MECHANICAL ENGINEERING -->
  <text font-family="'Inter', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" fill="url(#gold-bright)" letter-spacing="3.8">
    <textPath href="#text-arc-top" startOffset="50%" text-anchor="middle">
      MECHANICAL ENGINEERING
    </textPath>
  </text>

  <!-- Text: CAIRO UNIVERSITY · BATCH 30 -->
  <text font-family="'Inter', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="14.5" font-weight="800" fill="url(#gold-bright)" letter-spacing="2.8">
    <textPath href="#text-arc-bottom" startOffset="50%" text-anchor="middle">
      CAIRO UNIVERSITY • BATCH 30
    </textPath>
  </text>

  <!-- Side Stars -->
  <g transform="translate(46, 256) scale(0.7)">
    <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="url(#gold)"/>
  </g>
  <g transform="translate(466, 256) scale(0.7)">
    <polygon points="0,-10 3,-3 10,0 3,3 0,10 -3,3 -10,0 -3,-3" fill="url(#gold)"/>
  </g>

  <!-- BACKGROUND: Cairo University Dome & Clock Tower -->
  <g opacity="0.42">
    <!-- Clock Tower -->
    <rect x="306" y="145" width="26" height="110" fill="#caa144"/>
    <rect x="312" y="156" width="14" height="24" rx="3" fill="#040813"/>
    <circle cx="319" cy="198" r="6" fill="#f8fafc" stroke="#aa7a1e" stroke-width="1.5"/>
    <polygon points="304,145 319,118 334,145" fill="#e5c158"/>
    <!-- Dome Base & Arch -->
    <rect x="174" y="200" width="138" height="55" fill="#b99035"/>
    <rect x="194" y="172" width="98" height="28" fill="#caa144"/>
    <path d="M 194,172 C 194,108 292,108 292,172 Z" fill="url(#gold)"/>
    <rect x="240" y="100" width="6" height="12" fill="#ffe082"/>
    <circle cx="243" cy="98" r="3" fill="#ffe082"/>
    <!-- Columns -->
    <line x1="184" y1="205" x2="184" y2="250" stroke="#040813" stroke-width="2"/>
    <line x1="200" y1="205" x2="200" y2="250" stroke="#040813" stroke-width="2"/>
    <line x1="216" y1="205" x2="216" y2="250" stroke="#040813" stroke-width="2"/>
    <line x1="270" y1="205" x2="270" y2="250" stroke="#040813" stroke-width="2"/>
    <line x1="286" y1="205" x2="286" y2="250" stroke="#040813" stroke-width="2"/>
  </g>

  <!-- FOREGROUND: Mechanical Gear -->
  <g transform="translate(256, 275)">
    <use href="#gear-tooth" transform="rotate(0)"/>
    <use href="#gear-tooth" transform="rotate(30)"/>
    <use href="#gear-tooth" transform="rotate(60)"/>
    <use href="#gear-tooth" transform="rotate(90)"/>
    <use href="#gear-tooth" transform="rotate(120)"/>
    <use href="#gear-tooth" transform="rotate(150)"/>
    <use href="#gear-tooth" transform="rotate(180)"/>
    <use href="#gear-tooth" transform="rotate(210)"/>
    <use href="#gear-tooth" transform="rotate(240)"/>
    <use href="#gear-tooth" transform="rotate(270)"/>
    <use href="#gear-tooth" transform="rotate(300)"/>
    <use href="#gear-tooth" transform="rotate(330)"/>

    <circle cx="0" cy="0" r="90" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="74" fill="#0b172a" stroke="url(#gold)" stroke-width="5"/>

    <circle cx="0" cy="-48" r="11" fill="#040813" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="48" cy="0" r="11" fill="#040813" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="0" cy="48" r="11" fill="#040813" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="-48" cy="0" r="11" fill="#040813" stroke="url(#gold)" stroke-width="2"/>

    <circle cx="0" cy="0" r="32" fill="url(#gold)"/>
    <circle cx="0" cy="0" r="18" fill="#040813"/>
  </g>

  <!-- FOREGROUND HERO: Piston & Connecting Rod -->
  <g transform="translate(256, 275) rotate(26)">
    <circle cx="0" cy="0" r="32" fill="none" stroke="url(#steel-light)" stroke-width="12"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#1e293b" stroke-width="3"/>
    
    <circle cx="-26" cy="0" r="4" fill="#f8fafc"/>
    <circle cx="26" cy="0" r="4" fill="#f8fafc"/>

    <rect x="-10" y="-120" width="20" height="96" rx="4" fill="url(#steel-light)"/>
    <rect x="-4" y="-112" width="8" height="80" rx="2" fill="url(#steel-dark)"/>

    <circle cx="0" cy="-126" r="17" fill="url(#steel-light)"/>
    <circle cx="0" cy="-126" r="8" fill="#0f172a"/>

    <rect x="-38" y="-195" width="76" height="68" rx="6" fill="url(#steel-light)"/>
    <path d="M -30,-127 Q 0,-140 30,-127" fill="none" stroke="#1e293b" stroke-width="4"/>

    <line x1="-38" y1="-183" x2="38" y2="-183" stroke="#1e293b" stroke-width="3"/>
    <line x1="-38" y1="-173" x2="38" y2="-173" stroke="#1e293b" stroke-width="3"/>
    <line x1="-38" y1="-163" x2="38" y2="-163" stroke="#1e293b" stroke-width="3"/>

    <path d="M -38,-195 Q 0,-202 38,-195 Z" fill="#ffffff"/>
    <rect x="-24" y="-193" width="8" height="62" fill="#ffffff" opacity="0.35"/>
  </g>
</svg>
